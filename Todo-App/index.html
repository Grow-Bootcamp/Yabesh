<!doctype html>
<html lang="en">
  <head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <div class="header-content">
        <img src="logo.png" alt="To-Do List App icon" width="80" />

        <div>
          <h1>My Todo App</h1>
          <p>Organize Your Tasks Easily</p>
        </div>
      </div>
    </header>

    <main>
      <!-- Search Section -->
      <section>
        <h2>Search tasks</h2>
        <label for="SearchInput"></label>
        <input
          type="search"
          id="SearchInput"
          name="Search"
          placeholder="Search tasks..."
        />
      </section>

      <!-- Add Task Section -->
      <section>
        <h2>Add a New Task</h2>
        <form id="todoForm">
          <label for="taskInput"></label>
          <input
            type="text"
            id="taskInput"
            name="task"
            placeholder="Add a new task..."
            required
          />
          <button type="submit">Add Task</button>
        </form>
      </section>

      <!-- Todo List Section -->
      <section>
        <h2>To-Do List</h2>
        <ul id="todolist">
          <!-- Tasks will be created here using JavaScript DOM manipulation. -->
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 My Todo App</p>
    </footer>

    <!-- JavaScript -->
    <!-- <script src="script.js"></scrip> -->
  </body>
</html>
